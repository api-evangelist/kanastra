aid: kanastra
name: Kanastra
description: >-
  Kanastra is a Brazilian fintech building full-stack infrastructure for banking and the private
  credit market. Its Banking API offers banking-as-a-service capabilities to financial institutions,
  funds and securitization vehicles: financial (checking) accounts with balances and transactions,
  PIX (key registration, transfers, deposits, and static/dynamic QR Codes on the BR Code / EMV-QRCPS
  standard), boleto (bank slip) issuance with CNAB return-file processing settled via the Nuclea
  clearing house, TED transfers, wallets, commercial notes (CCB) with guarantees and documents, and
  issuers. Authentication uses a private_key_jwt (ES512 client-assertion) flow that returns a scoped
  Bearer JWT, and a webhook surface streams bank slip and CNAB lifecycle events. Kanastra is backed by
  QED Investors, Kaszek, Valor Capital, Quona Capital, Itau, IFC and F-Prime.
url: https://raw.githubusercontent.com/api-evangelist/kanastra/refs/heads/main/apis.yml
